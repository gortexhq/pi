name: Latest Pi

# The Pi dev dependencies stay pinned; this run tells when the latest Pi
# breaks the extension and the pin needs a bump.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-tui@latest

      - run: jq -r '"\(.name) \(.version)"' node_modules/@earendil-works/pi-coding-agent/package.json node_modules/@earendil-works/pi-tui/package.json

      - run: npm run typecheck

      - run: npm test
