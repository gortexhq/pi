version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels: [dependencies]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    labels: [dependencies]
    ignore:
      # Tracks the engines.node floor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Pinned to the Pi the suites run against; bumped by hand when the
      # extension needs a newer Pi.
      - dependency-name: "@earendil-works/*"
    groups:
      dev-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["@earendil-works/*"]
        update-types: [minor, patch]
